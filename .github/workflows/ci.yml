name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # No npm install: the tests use node:test, the package itself and a fake
      # mind-set package (test/fixtures/mind-set); the pack test installs the
      # `npm pack` output beside a packed fake mind-set into a throwaway HOME.
      - run: npm test
